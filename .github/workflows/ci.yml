name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["**/*.py", "pyproject.toml", "uv.lock", "tests/fixtures/**", ".github/workflows/ci.yml", "WHATS-CHANGED.md", "docs/**/*.html"]

permissions:
  contents: read

jobs:
  static:
    name: Lockfile, dependencies, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv lock --check
      - run: uv run --python 3.14 deptry .
      - run: uv run --python 3.14 ruff check .

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --python ${{ matrix.python }} pytest -q

  # WHATS-CHANGED.md parses, dates and tags hold, corrections say what to re-check, and old
  # entries are never edited (only "Update" lines may be added). Then the What's changed page
  # must match the file. scripts/whats_changed.py is copied unchanged from betanyc-ai-workspace.
  whats-changed:
    name: What's changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check WHATS-CHANGED.md
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref || 'main' }}"
      - name: Check the What's changed page is current
        run: >-
          python3 scripts/whats_changed.py render WHATS-CHANGED.md --format fragment --no-h1
          --site-prefix docs/ --repo-url https://github.com/BetaNYC/nypd-weekly-archive
          --into docs/whats-changed.html --check
